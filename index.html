<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a0b0d">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Block Builder">
<title>Block Builder — Engine teardown companion</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0d;--panel:#14161a;--panel2:#1b1e23;--line:rgba(255,255,255,.085);--text:#eef0f2;--mute:#98a2ad;--am:#ffa238;--am2:#e8761a;--ok:#5fd68a;--bad:#ff6b5b;--disp:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--sans:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:#3a3f47 transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(#3a3f47,#2a2e34);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:linear-gradient(var(--am),var(--am2));background-clip:padding-box;border:2px solid transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{font:16px/1.5 var(--sans);color:var(--text);background:var(--bg);background-image:radial-gradient(800px 420px at 50% -10%,rgba(255,162,56,.11),transparent 62%),repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 6px);display:flex;justify-content:center}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}button{cursor:pointer}
.app{width:100%;max-width:760px;height:var(--h,100dvh);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);position:relative}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--am);outline-offset:2px}
h1,h2,h3,.disp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
/* splash */
#splash{position:fixed;inset:0;z-index:99;background:var(--bg) radial-gradient(600px 400px at 50% 42%,rgba(255,162,56,.14),transparent 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s var(--ease),visibility 0s .6s}
#splash.out{opacity:0;visibility:hidden}#splash .lg{width:110px;height:110px}#splash h2{font-size:42px;letter-spacing:.2em;animation:up .8s .5s var(--ease) both}#splash p{color:var(--mute);margin-top:-8px;letter-spacing:.14em;font-size:13px;text-transform:uppercase;animation:up .8s .7s var(--ease) both}
.ld{width:140px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}.ld::after{content:"";display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--am),transparent);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(330%)}}@keyframes up{from{opacity:0;transform:translateY(10px)}}
.logo{display:block;width:100%;height:100%;overflow:visible}.logo .hx{fill:url(#lb);stroke:url(#la);stroke-width:2.4;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1s .1s var(--ease) forwards}
.logo .rg{transform-box:fill-box;transform-origin:center;animation:pop .6s .7s var(--ease) both}.logo .ar{fill:none;stroke:url(#la);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr .7s .9s var(--ease) forwards}.logo .cr{transform-box:fill-box;transform-origin:center;animation:pop .5s 1.2s var(--ease) both}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes pop{from{transform:scale(0);opacity:0}}
/* header */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px}.top .lg{width:42px;height:42px;flex:none}.brand{min-width:0}.brand h1{font-size:23px;line-height:1;letter-spacing:.1em;white-space:nowrap}.brand span{display:block;font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin-top:3px;white-space:nowrap}.top .grow{display:none}.brand{flex:1}.pill{flex:none}@media(max-width:430px){.brand span{display:none}.brand h1{font-size:20px;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis}.pill{max-width:104px;padding:0 12px}}.grow{flex:1}
.pill{min-height:44px;max-width:170px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.045);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;transition:transform .15s,border-color .2s}.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill:active,.btn:active,.chipb:active{transform:scale(.96)}.pill:hover{border-color:rgba(255,162,56,.45)}
#off{background:var(--am);color:#1c1004;font-size:14px;font-weight:600;padding:6px 16px}
.pane{display:none;flex:1;min-height:0;flex-direction:column}.pane.on{display:flex;animation:pin .32s var(--ease) both}@keyframes pin{from{opacity:0;transform:translateY(10px)}}
.scroll{overflow-y:auto;padding:4px 16px 20px;flex:1}
.card{background:linear-gradient(180deg,#181b20,#121418);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 30px -20px #000;position:relative}
h3{font-size:19px;margin-bottom:8px}.mut{color:var(--mute);font-size:14px}.hint{color:var(--mute);font-size:14px;margin-top:8px}
.btn{min-height:50px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,filter .2s;text-decoration:none}
.btn.pri{background:linear-gradient(180deg,#ffbe6b,#f08a22);color:#1c1004;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 22px -8px rgba(255,162,56,.55)}.btn.sm{min-height:42px;padding:0 14px;font-size:14px}.btn.wide{width:100%}.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f{background:#0e1013;border:1px solid var(--line);border-radius:12px;min-height:50px;padding:0 14px;font-size:16px;width:100%;transition:border-color .2s,box-shadow .2s}.f:focus{outline:0;border-color:var(--am);box-shadow:0 0 0 3px rgba(255,162,56,.16)}textarea.f{padding:12px 14px;resize:vertical;min-height:90px;line-height:1.45}select.f{appearance:none}
.lab{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px;letter-spacing:.04em;text-transform:uppercase}
.chipb{min-height:42px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:all .2s}.chipb.on{background:var(--am);color:#1c1004;border-color:var(--am)}
/* library */
.search{margin:2px 16px 10px;position:relative}.search .i{position:absolute;left:14px;top:14px;color:var(--mute)}.search input{padding-left:44px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.eng{width:100%;text-align:left;display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,#171a1f,#121418);margin-bottom:10px;transition:transform .2s var(--ease),border-color .2s;animation:pin .4s var(--ease) both}.eng:hover{border-color:rgba(255,162,56,.5);transform:translateY(-1px)}
.eng .big{font:700 30px/1 var(--disp);color:var(--am);min-width:66px;text-align:center}.eng .big small{display:block;font:500 12px var(--sans);color:var(--mute);letter-spacing:.06em;margin-top:3px}
.eng b{display:block;font-size:17px;line-height:1.25}.eng .sp{color:var(--mute);font-size:13.5px}.tag{display:inline-block;padding:1px 8px;border-radius:6px;background:rgba(255,162,56,.12);color:var(--am);font-size:12px;font-weight:600;margin-right:5px}
.custom{border-style:dashed;background:transparent}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.spec div{background:#0e1013;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.spec span{display:block;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}.spec b{font-weight:600}
.tips{margin:8px 0 0 18px;color:#cbd2d9;font-size:14.5px}.tips li{margin-bottom:6px}
/* steps */
.ring{position:relative;width:76px;height:76px;flex:none}.ring svg{transform:rotate(-90deg);width:100%;height:100%}.ring circle{fill:none;stroke-width:3.2;stroke-linecap:round}.rb{stroke:rgba(255,255,255,.08)}.rf{stroke:var(--am);transition:stroke-dasharray .8s var(--ease);filter:drop-shadow(0 0 3px rgba(255,162,56,.6))}.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 20px var(--disp);letter-spacing:.03em}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px}.ph h3{margin:0;color:var(--am)}
.stp{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#16191d,#121418);margin-bottom:8px;overflow:hidden}.stp.done{opacity:.62}
.sh{display:flex;align-items:center;gap:12px;padding:6px 12px 6px 8px;min-height:56px;width:100%;background:none;border:0;text-align:left}
.cb{width:40px;height:40px;border-radius:12px;border:1.5px solid #4a5058;display:grid;place-items:center;flex:none;transition:all .25s var(--ease);background:#0e1013;color:transparent}.cb .i{width:20px;height:20px;stroke-width:3}.done .cb{background:var(--am);border-color:var(--am);color:#1c1004;animation:pop2 .3s var(--ease)}@keyframes pop2{50%{transform:scale(1.18)}}
.stp .t{flex:1;font-weight:600;line-height:1.3}.done .t{text-decoration:line-through;color:var(--mute)}.chev{transition:transform .25s var(--ease);color:var(--mute)}.open .chev{transform:rotate(90deg)}
.sd{display:none;padding:2px 16px 16px 60px;color:#cfd5db;font-size:15px}.open .sd{display:block;animation:pin .3s var(--ease) both}.sd .tp{margin-top:8px;padding:8px 12px;border-left:2px solid var(--am);background:rgba(255,162,56,.07);border-radius:0 8px 8px 0;font-size:14px}
.next{display:flex;gap:12px;align-items:center}.next .nt{flex:1}
/* photos */
.seg{display:flex;gap:4px;margin:4px 16px 10px;padding:4px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}.seg button{flex:1;min-height:42px;border:0;border-radius:10px;background:none;color:var(--mute);font-weight:600;transition:all .25s var(--ease)}.seg button.on{background:var(--panel2);color:var(--am);box-shadow:inset 0 0 0 1px rgba(255,162,56,.35)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.shot{position:relative;aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:#0e1013;overflow:hidden;padding:0;animation:pin .35s var(--ease) both}.shot img{width:100%;height:100%;object-fit:cover;display:block}.shot.empty{border-style:dashed;display:grid;place-items:center;color:var(--mute);text-align:center;padding:6px;font-size:12px}.shot.empty .i{margin:0 auto 4px;width:26px;height:26px}
.shot span.cap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:12px;font-weight:600;text-align:left}
/* overlays */
.ov{position:fixed;inset:0;z-index:80;background:var(--bg) radial-gradient(700px 400px at 50% -10%,rgba(255,162,56,.12),transparent 60%);display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.ov.on{display:flex;animation:fade .25s both}@keyframes fade{from{opacity:0}}
.ovi{width:100%;max-width:760px;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column}
.wtop{display:flex;align-items:center;gap:12px;padding:12px 16px}.wbar{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}.wbar i{display:block;height:100%;background:linear-gradient(90deg,var(--am2),var(--am));transition:width .4s var(--ease)}
.wbody{flex:1;overflow-y:auto;padding:6px 20px 12px}.wbody h2{font-size:32px;line-height:1.05;margin:6px 0 8px}.wbody p{color:#cfd5db}
.wdiag{height:120px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#14171b,#0f1114);display:grid;place-items:center;margin:4px 0 14px}.wdiag svg{height:100%;width:auto;max-width:100%}.eb{fill:#1c2026;stroke:#59616b;stroke-width:1.5}.et{fill:#7d8792;font:600 8px var(--disp);letter-spacing:.2em;text-anchor:middle}.cam{fill:var(--am)}.rg2{fill:none;stroke:var(--am);stroke-dasharray:3 3;stroke-width:1.4}
.wprev{width:100%;max-height:42dvh;object-fit:contain;border-radius:14px;border:1px solid var(--line);margin-top:12px;background:#000}
.wfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 20px 16px}.shutter{width:78px;height:78px;border-radius:50%;border:4px solid var(--am);background:radial-gradient(circle,#ffd9a6 0 44%,transparent 46%);display:grid;place-items:center;box-shadow:0 0 0 6px rgba(255,162,56,.14),0 10px 30px -8px rgba(255,162,56,.6);transition:transform .15s}.shutter:active{transform:scale(.92)}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:90}.flash.on{animation:fl .35s ease-out}@keyframes fl{0%{opacity:.85}100%{opacity:0}}
.vimg{flex:1;min-height:0;display:grid;place-items:center;padding:0 10px}.vimg img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
/* ask */
.ctxb{margin:0 16px 4px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;color:var(--mute);text-align:left}.ctxb b{color:var(--text);font-weight:600}.ctxb span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chat{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}.empty{margin:auto 0}.empty .lg{width:58px;height:58px;margin-bottom:14px}.empty h2{font-size:34px;line-height:1.05;margin-bottom:8px}.empty p{color:var(--mute);max-width:430px}
.msg{max-width:94%;line-height:1.65;animation:pin .35s var(--ease) both}.msg.user{align-self:flex-end;background:linear-gradient(180deg,#252a31,#1c2026);border:1px solid var(--line);padding:11px 15px;border-radius:18px 18px 4px 18px}.msg.bot{align-self:flex-start;padding-left:15px;border-left:2px solid var(--am)}.msg.bot p{margin-bottom:10px}.msg.bot p:last-child{margin:0}.msg.bot ul,.msg.bot ol{margin:0 0 10px 20px}.msg.bot li{margin-bottom:4px}.msg.bot strong{color:var(--am);font-weight:600}.msg.err{border-left-color:var(--bad);color:var(--bad)}.msg code{background:#0e1013;padding:1px 6px;border-radius:5px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:10px}
.typing{display:flex;gap:5px;padding:8px 0}.typing i{width:8px;height:8px;border-radius:50%;background:var(--am);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{0%,80%,100%{opacity:.2;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
.caret{display:inline-block;width:8px;height:1.05em;margin-left:2px;vertical-align:-3px;background:var(--am);border-radius:2px;animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
.quick{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}
.composer{padding:4px 16px 8px}#preview{display:flex;gap:8px;flex-wrap:wrap}#preview:empty{display:none}.pv{position:relative;margin-bottom:8px}.pv img{width:58px;height:58px;object-fit:cover;border-radius:10px;display:block}.pv button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--panel2)}
.box{display:flex;align-items:flex-end;gap:2px;background:#101215;border:1.5px solid var(--line);border-radius:22px;padding:6px;transition:border-color .2s,box-shadow .2s}.box:focus-within{border-color:rgba(255,162,56,.6);box-shadow:0 0 0 4px rgba(255,162,56,.1)}
#input{flex:1;background:none;border:0;outline:0;resize:none;max-height:130px;padding:12px 6px;line-height:1.4;font-size:16px}#input::placeholder{color:#76808b}
.ib{flex:none;width:48px;height:48px;border-radius:16px;border:0;display:grid;place-items:center;background:transparent;color:var(--mute);transition:all .2s}.send{background:linear-gradient(180deg,#ffbe6b,#f08a22);color:#1c1004}.send:active{transform:scale(.92)}
/* dock + sheet */
.dock{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin:4px 12px calc(env(safe-area-inset-bottom) + 8px);padding:6px;border-radius:24px;background:rgba(22,24,28,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 14px 34px -12px #000}
.ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:18px;background:rgba(255,162,56,.12);box-shadow:inset 0 0 0 1px rgba(255,162,56,.36);transform:translateX(calc(var(--ti,0)*100%));transition:transform .45s cubic-bezier(.3,1.25,.4,1)}
.dock button{position:relative;min-height:56px;background:none;border:0;color:var(--mute);font:600 13px var(--sans);letter-spacing:.03em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:color .25s}.dock button.on{color:var(--am)}
#sheet{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.62);backdrop-filter:blur(5px)}#sheet.on{display:flex;animation:fade .25s both}
.shc{width:100%;max-width:760px;max-height:90dvh;overflow:auto;background:#121417;border:1px solid var(--line);border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:slide .4s var(--ease)}@keyframes slide{from{transform:translateY(100%)}}.grab{width:42px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:0 auto 14px}
.shc h2{font-size:28px;line-height:1.05;margin-bottom:4px}
#toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,10px);background:var(--am);color:#1c1004;font-weight:600;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:95;max-width:90vw}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}#chat{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="splash"><div class="lg"></div><h2>Block Builder</h2><p>Engine teardown companion</p><div class="ld"></div></div>
<div class="app">
<header class="top"><div class="lg" id="hlogo"></div><div class="brand"><h1>Block Builder</h1><span>Engine teardown companion</span></div><span class="grow"></span><button class="pill" id="projbtn"></button></header>
<div id="off" hidden>Offline: engines, steps and photos work. Chat needs a connection.</div>

<section class="pane on" id="p-lib">
  <div class="search"><svg class="i"><use href="#i-search"/></svg><input class="f" id="q" type="search" placeholder="Search 100+ engines: 350, LS, 2JZ, Cummins…" autocomplete="off" enterkeyhint="search"></div>
  <div class="chips" id="makes"></div>
  <div class="scroll" id="elist"></div>
</section>

<section class="pane" id="p-steps"><div class="scroll" id="steps"></div></section>

<section class="pane" id="p-photos"><div class="scroll" id="photos"></div></section>

<section class="pane" id="p-ask">
  <button class="ctxb" id="ctx"></button>
  <div id="chat" aria-live="polite"><div class="empty" id="empty"><div class="lg" id="elogo"></div><h2>What are you pulling apart?</h2><p>Ask about any step, attach photos or a short video of a part, and get help reading wear, leaks and damage.</p></div></div>
  <div class="quick" id="quick"></div>
  <div class="composer"><div id="preview"></div><div class="box">
    <button class="ib" id="attach" aria-label="Attach photos or video"></button>
    <textarea id="input" rows="1" placeholder="Ask about a step, a part, or a noise…" aria-label="Message" enterkeyhint="send" autocapitalize="sentences"></textarea>
    <button class="ib send" id="send" aria-label="Send"></button></div></div>
</section>

<nav class="dock" id="dock" aria-label="Sections"><span class="ind"></span>
  <button class="on" data-t="lib"></button><button data-t="steps"></button><button data-t="photos"></button><button data-t="ask"></button></nav>
</div>
<div class="ov" id="wiz"><div class="ovi" id="wizc"></div></div>
<div class="ov" id="viewer"><div class="ovi" id="viewc"></div></div>
<div id="sheet"><div class="shc" id="shc"></div></div><div id="toast" role="status"></div><div class="flash" id="flash"></div>
<input type="file" id="file" accept="image/*,video/*" multiple hidden>
<input type="file" id="wcam" accept="image/*" capture="environment" hidden>
<input type="file" id="wlib" accept="image/*" hidden>
<input type="file" id="wvid" accept="video/*" capture="environment" hidden>
<script src="/engines.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- icons + logo ---------- */
const ICON={lib:'M3 7l9-4 9 4-9 4zM3 12l9 4 9-4M3 17l9 4 9-4',list:'M5 4h14v17H5zM9 4v3h6V4M9 13l2 2 4-4',camera:'M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7',msg:'M4 5h16v11H9l-5 4z',search:'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14M20 20l-4-4',clip:'M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3',up:'M12 19V5M5 12l7-7 7 7',stop:'M7 7h10v10H7z',check:'M5 12l4 4 10-10',chev:'M9 6l6 6-6 6',x:'M6 6l12 12M18 6L6 18',plus:'M12 5v14M5 12h14',back:'M15 6l-6 6 6 6',video:'M4 7h11v10H4zM15 11l5-3v8l-5-3',trash:'M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13',wand:'M5 19L15 9M14 4l1 2 2 1-2 1-1 2-1-2-2-1 2-1zM19 12l.7 1.3L21 14l-1.3.7L19 16l-.7-1.3L17 14l1.3-.7z',stack:'M4 6h16v4H4zM4 12h16v4H4z'};
const ic=(n,c='')=>`<svg class="i ${c}"><use href="#i-${n}"/></svg>`;
document.body.insertAdjacentHTML('afterbegin',`<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="la" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc067"/><stop offset="1" stop-color="#e8761a"/></linearGradient><radialGradient id="lb" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#2b3036"/><stop offset="1" stop-color="#0c0d10"/></radialGradient></defs>${Object.entries(ICON).map(([k,v])=>`<symbol id="i-${k}" viewBox="0 0 24 24"><path d="${v}"/></symbol>`).join('')}</svg>`);
const LOGO='<svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path class="hx" pathLength="1" d="M32 3.5 57 18v28L32 60.5 7 46V18z"/><circle class="rg" cx="32" cy="32" r="14.5" fill="#0c0d10" stroke="#c3ccd6" stroke-opacity=".55" stroke-width="1.4"/><path class="ar" pathLength="1" d="M21.5 36a11.5 11.5 0 0 1 11.5-11.5"/><circle class="cr" cx="32" cy="32" r="5.2" fill="url(#la)"/></svg>';
['#splash .lg','#hlogo','#elogo'].forEach(s=>$(s).innerHTML=LOGO);
$('#attach').innerHTML=ic('clip');$('#send').innerHTML=ic('up');
$$('#dock button').forEach((b,i)=>b.innerHTML=ic(['lib','list','camera','msg'][i])+['Engines','Teardown','Photos','Ask'][i]);

/* ---------- state ---------- */
let S={projects:[],active:null,make:'All',q:''};
try{S={...S,...JSON.parse(localStorage.getItem('bb.s')||'{}')}}catch{}
const save=()=>{try{localStorage.setItem('bb.s',JSON.stringify({projects:S.projects,active:S.active}))}catch{}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove('on'),2400)};
const curProj=()=>S.projects.find(p=>p.id===S.active)||null;
const engOf=p=>p.engineId==='custom'?mkCustom(p.custom):ENGINES.find(e=>e.id===p.engineId);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const openSheet=h=>{$('#shc').innerHTML='<div class="grab"></div>'+h;$('#sheet').classList.add('on')},closeSheet=()=>$('#sheet').classList.remove('on');
$('#sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet()};

/* ---------- photo storage ---------- */
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
let storageOK=true;
function warnStorage(){if(!storageOK)return;storageOK=false;$('#off').textContent='Photo storage is blocked in this browser, so photos will be lost when you close it. Open the site in Safari or Chrome (not a private tab or in-app browser).';$('#off').hidden=false}
const dbp=withTimeout(new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('no idb'));const r=indexedDB.open('blockbuilder',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))}),4000);
dbp.catch(()=>{});
const dbx=async(m,f)=>{try{const d=await dbp;return await withTimeout(new Promise((res,rej)=>{const t=d.transaction('photos',m),q=f(t.objectStore('photos'));t.oncomplete=()=>res(q?.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}),6000)}catch(e){warnStorage();return undefined}};
let PH=[];
async function loadPhotos(){const p=curProj(),all=p?((await dbx('readonly',s=>s.getAll()))||[]):[];if(curProj()===p)PH=p?all.filter(x=>x.pid===p.id).sort((a,b)=>a.t-b.t):[];renderPhotos()}
function toJpeg(s,w,h,max,q=.82){const k=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(s,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
const loadImg=u=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Could not read that image'));i.src=u});
const fileImg=async(f,max=1600,q=.82)=>{const u=URL.createObjectURL(f);try{const i=await loadImg(u);return toJpeg(i,i.naturalWidth,i.naturalHeight,max,q)}finally{URL.revokeObjectURL(u)}};
const shrink=async(d,max,q=.74)=>{const i=await loadImg(d);return toJpeg(i,i.naturalWidth,i.naturalHeight,max,q)};
const frames=(f,n,max)=>new Promise((res,rej)=>{const u=URL.createObjectURL(f),v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=u;v.onerror=()=>rej(new Error('Could not read that video'));
  v.onloadedmetadata=async()=>{const d=v.duration||1,o=[];for(let i=0;i<n;i++){v.currentTime=Math.min(d-.05,d*(i+.5)/n);await new Promise(r=>v.onseeked=r);o.push(toJpeg(v,v.videoWidth,v.videoHeight,max))}URL.revokeObjectURL(u);res({o,d})}});
async function savePhoto(ph){await dbx('readwrite',s=>s.put(ph));PH=PH.filter(x=>x.id!==ph.id);PH.push(ph);PH.sort((a,b)=>a.t-b.t)}
async function delPhoto(id){await dbx('readwrite',s=>s.delete(id));PH=PH.filter(x=>x.id!==id)}

/* ---------- navigation ---------- */
const TABS=['lib','steps','photos','ask'];
function go(t){$$('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));$$('#dock button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('#dock').style.setProperty('--ti',TABS.indexOf(t));if(t==='ask')setTimeout(()=>chat.scrollTop=chat.scrollHeight,60)}
$$('#dock button').forEach(b=>b.onclick=()=>go(b.dataset.t));

/* ---------- library ---------- */
function renderMakes(){const c={};ENGINES.forEach(e=>c[e.make]=(c[e.make]||0)+1);const m=Object.keys(c).sort((a,b)=>c[b]-c[a]||a.localeCompare(b));
  $('#makes').innerHTML=['All',...m].map(x=>`<button class="chipb ${S.make===x?'on':''}" data-m="${esc(x)}">${esc(x)}</button>`).join('');
  $$('#makes button').forEach(b=>b.onclick=()=>{S.make=b.dataset.m;renderMakes();renderLib()})}
function renderLib(){const q=S.q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  const list=ENGINES.filter(e=>(S.make==='All'||e.make===S.make)&&q.every(w=>(e.title+' '+e.apps+' '+e.disp+' '+e.years+' '+e.cfg+' '+VALVE[e.valve]).toLowerCase().includes(w)));
  $('#elist').innerHTML=`<button class="eng custom" id="cust"><span class="big">+</span><span><b>My engine isn’t listed</b><span class="sp">Build a custom teardown from the layout, valvetrain and fuel type.</span></span></button>`+
  list.map((e,i)=>`<button class="eng" data-e="${e.id}" style="animation-delay:${Math.min(i,12)*25}ms"><span class="big">${esc((e.disp.match(/[\d.]+L/)||[e.cfg])[0])}<small>${esc(e.cfg)}</small></span><span><b>${esc(e.title)}</b><span class="sp"><span class="tag">${VALVE[e.valve]}</span>${esc(e.years)}${e.boost?' · Boosted':''}<br>${esc(e.apps)}</span></span></button>`).join('')+(list.length?'':'<p class="hint" style="text-align:center;padding:30px">No match. Try a make, displacement or car name, or build a custom engine.</p>');
  $$('#elist [data-e]').forEach(b=>b.onclick=()=>engineSheet(b.dataset.e));$('#cust').onclick=customSheet}
$('#q').oninput=e=>{S.q=e.target.value;renderLib()};
function engineSheet(id){const e=ENGINES.find(x=>x.id===id),st=stepsFor(e),an=anglesFor(e);
  openSheet(`<h2>${esc(e.title)}</h2><div class="mut">${esc(e.years)} · ${esc(e.apps)}</div>
  <div class="spec"><div><span>Layout</span><b>${e.cfg}</b></div><div><span>Displacement</span><b>${esc(e.disp)}</b></div><div><span>Valvetrain</span><b>${VALVE[e.valve]}</b></div><div><span>Timing</span><b>${TIMING[e.timing]}</b></div><div><span>Fuel</span><b>${FUEL[e.fuel]}</b></div><div><span>Block</span><b>${e.block==='alu'?'Aluminum':'Iron'}${e.boost?' · Boosted':''}</b></div></div>
  <h3>Know before you start</h3><p style="color:#cfd5db">${esc(e.note)}</p><ul class="tips">${tipsFor(e).slice(0,4).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
  <p class="hint">${st.length} teardown steps · ${an.before.length} photo angles before teardown</p>
  <label class="lab">Project name</label><input class="f" id="pn" value="${esc(e.title)}" maxlength="60">
  <div class="row" style="margin-top:14px"><button class="btn pri" id="pgo" style="flex:1">Start teardown project</button><button class="btn" id="pask">Ask</button></div>`);
  $('#pgo').onclick=()=>newProject(e.id,null,$('#pn').value);$('#pask').onclick=()=>{closeSheet();go('ask');send(`Tell me what to know before pulling apart a ${e.title} (${e.disp}, ${e.years}): common failure points and teardown gotchas.`)}}
function customSheet(){const o=(a,sel)=>a.map(([v,l])=>`<option value="${v}" ${v===sel?'selected':''}>${l}</option>`).join('');
  openSheet(`<h2>Custom engine</h2><p class="mut">Pick what you know. Steps and photo angles are built from this.</p>
  <label class="lab">Layout</label><select class="f" id="cc">${o([['I4','Inline 4'],['I5','Inline 5'],['I6','Inline 6'],['V6','V6'],['V8','V8'],['V10','V10'],['V12','V12'],['H4','Flat 4'],['H6','Flat 6'],['R2','Rotary (2 rotor)']],'V8')}</select>
  <label class="lab">Valvetrain</label><select class="f" id="cv">${o([['ohv','Pushrod (OHV)'],['sohc','SOHC'],['dohc','DOHC']],'ohv')}</select>
  <label class="lab">Timing drive</label><select class="f" id="ct">${o([['chain','Chain'],['belt','Belt'],['gear','Gears']],'chain')}</select>
  <label class="lab">Fuel</label><select class="f" id="cf">${o([['carb','Carburetor'],['tbi','Throttle-body injection'],['efi','Port injection'],['di','Direct injection'],['dsl','Diesel']],'efi')}</select>
  <label class="lab">Block</label><select class="f" id="cb">${o([['iron','Iron'],['alu','Aluminum']],'iron')}</select>
  <div class="row" style="margin-top:12px"><label class="chipb"><input type="checkbox" id="cbo" style="accent-color:#ffa238"> Turbo or supercharger</label><label class="chipb"><input type="checkbox" id="cdi" style="accent-color:#ffa238"> Distributor</label></div>
  <label class="lab">Project name</label><input class="f" id="pn" placeholder="e.g. 1972 C10 350" maxlength="60">
  <button class="btn pri wide" id="pgo" style="margin-top:14px">Start teardown project</button>`);
  $('#pgo').onclick=()=>{const c={cfg:$('#cc').value,valve:$('#cv').value,timing:$('#ct').value,fuel:$('#cf').value,block:$('#cb').value,boost:$('#cbo').checked,dist:$('#cdi').checked};newProject('custom',c,$('#pn').value||'Custom engine')}}
async function newProject(engineId,custom,name){const p={id:uid(),engineId,custom,name:(name||'').trim()||'New project',created:Date.now(),checks:{},notes:''};S.projects.push(p);S.active=p.id;save();PH=[];openStep=-1;closeSheet();renderAll();go('steps');toast('Project started. Open Photos to document the engine first.');loadPhotos()}

/* ---------- projects ---------- */
function renderProjBtn(){const p=curProj();$('#projbtn').innerHTML=ic('stack')+`<span>${p?esc(p.name):'No project'}</span>`}
$('#projbtn').onclick=()=>{openSheet(`<h2>Projects</h2>${S.projects.length?'':'<p class="mut">No projects yet. Pick an engine to start one.</p>'}`+S.projects.map(p=>`<div class="row" style="margin:8px 0"><button class="btn" data-p="${p.id}" style="flex:1;justify-content:flex-start;${p.id===S.active?'border-color:#ffa238':''}">${esc(p.name)}</button><button class="btn sm" data-d="${p.id}" aria-label="Delete">${ic('trash')}</button></div>`).join('')+'<button class="btn pri wide" id="pnew" style="margin-top:10px">Pick an engine for a new project</button>');
  $$('#shc [data-p]').forEach(b=>b.onclick=async()=>{S.active=b.dataset.p;save();closeSheet();PH=[];renderAll();loadPhotos()});
  $$('#shc [data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this project and its photos?'))return;const id=b.dataset.d;for(const x of ((await dbx('readonly',s=>s.getAll()))||[]).filter(x=>x.pid===id))await dbx('readwrite',s=>s.delete(x.id));S.projects=S.projects.filter(p=>p.id!==id);if(S.active===id)S.active=S.projects[0]?.id||null;save();closeSheet();await loadPhotos();renderAll()});
  $('#pnew').onclick=()=>{closeSheet();go('lib')}};

/* ---------- teardown steps ---------- */
let openStep=-1;
function renderSteps(){const p=curProj(),el=$('#steps');
  if(!p){el.innerHTML=`<div class="card" style="margin-top:8px"><h3>No project yet</h3><p class="mut">Pick an engine from the library to get its step-by-step teardown, photo checklist and notes.</p><button class="btn pri wide" id="tolib" style="margin-top:12px">Browse engines</button></div>`;$('#tolib').onclick=()=>go('lib');return}
  const e=engOf(p),st=stepsFor(e),done=st.filter((_,i)=>p.checks[i]).length,ni=st.findIndex((_,i)=>!p.checks[i]),pct=done/st.length*100;let ph='';
  el.innerHTML=`<div class="card" style="margin-top:8px"><div class="row" style="flex-wrap:nowrap;gap:14px"><div style="flex:1;min-width:0"><div class="mut disp" style="letter-spacing:.12em">Teardown</div><h3 style="font-size:22px;line-height:1.1;margin:2px 0">${esc(p.name)}</h3><div class="mut">${esc(e.title)} · ${e.cfg} · ${esc(e.disp)}</div></div><div class="ring"><svg viewBox="0 0 36 36"><circle class="rb" cx="18" cy="18" r="15.9"/><circle class="rf" cx="18" cy="18" r="15.9" pathLength="100" stroke-dasharray="0 100" id="rf"/></svg><b>${done}/${st.length}</b></div></div></div>
  ${ni>=0?`<div class="card next"><div class="nt"><div class="mut">Up next</div><b style="font-size:17px">${esc(st[ni].t)}</b></div><button class="btn pri sm" id="nxt">Open</button></div>`:`<div class="card"><h3>Teardown complete</h3><p class="mut">Everything is checked off. Review your notes and plan parts and machine work.</p></div>`}
  <details class="card"><summary style="cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center">Know before you start ${ic('chev','chev')}</summary><p style="color:#cfd5db;margin-top:10px">${esc(e.note)}</p><ul class="tips">${tipsFor(e).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details>`+
  st.map((s,i)=>{let h='';if(s.ph!==ph){ph=s.ph;const t=st.filter(x=>x.ph===ph),d=t.filter(x=>p.checks[st.indexOf(x)]).length;h=`<div class="ph"><h3>${esc(ph)}</h3><span class="mut">${d}/${t.length}</span></div>`}
    return h+`<div class="stp ${p.checks[i]?'done':''} ${openStep===i?'open':''}" data-i="${i}"><div class="sh"><button class="cb" data-c="${i}" aria-label="Mark done">${ic('check')}</button><button class="t" data-o="${i}" style="background:none;border:0;text-align:left;flex:1;min-height:44px;font-weight:600">${esc(s.t)}</button>${ic('chev','chev')}</div><div class="sd"><p>${esc(s.d)}</p>${s.tip?`<div class="tp">${esc(s.tip)}</div>`:''}<div class="row" style="margin-top:10px"><button class="btn sm" data-a="${i}">Ask about this step</button></div></div></div>`}).join('')+
  `<div class="card" style="margin-top:16px"><h3>Teardown notes</h3><textarea class="f" id="pnotes" placeholder="What you found: wear, damage, measurements, part numbers…">${esc(p.notes)}</textarea></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>$('#rf')?.setAttribute('stroke-dasharray',pct+' 100')));
  $$('#steps [data-c]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const i=+b.dataset.c;p.checks[i]=!p.checks[i];save();const y=el.scrollTop;renderSteps();el.scrollTop=y;if(navigator.vibrate)navigator.vibrate(15)});
  $$('#steps [data-o]').forEach(b=>b.onclick=()=>{const i=+b.dataset.o;openStep=openStep===i?-1:i;const y=el.scrollTop;renderSteps();el.scrollTop=y});
  $$('#steps [data-a]').forEach(b=>b.onclick=()=>{const s=st[+b.dataset.a];go('ask');send(`I'm on the step "${s.t}" for my ${e.title}. ${s.d} What should I watch for, and what tools do I need?`)});
  $('#nxt')?.addEventListener('click',()=>{openStep=ni;renderSteps();el.querySelector(`.stp[data-i="${ni}"]`)?.scrollIntoView({behavior:'smooth',block:'center'})});
  $('#pnotes').oninput=ev=>{p.notes=ev.target.value;save()}}

/* ---------- photo walk-through ---------- */
const anglesOf=()=>{const p=curProj();return p?anglesFor(engOf(p)):{before:[],during:[]}};
let pstage='before';
function renderPhotos(){const p=curProj(),el=$('#photos');
  if(!p){el.innerHTML=`<div class="card" style="margin-top:8px"><h3>Document before you tear down</h3><p class="mut">Start a project first. Block Builder guides you through every angle so you always know where each part and hose went.</p><button class="btn pri wide" id="tolib2" style="margin-top:12px">Browse engines</button></div>`;$('#tolib2').onclick=()=>go('lib');return}
  const A=anglesOf(),list=A[pstage],have=k=>PH.find(x=>x.stage===pstage&&x.angle===k),got=list.filter(a=>have(a.key)).length,extras=PH.filter(x=>x.stage===pstage&&!list.some(a=>a.key===x.angle)),next=list.findIndex(a=>!have(a.key));
  el.innerHTML=`<div class="seg" style="margin:4px 0 12px"><button data-s="before" class="${pstage==='before'?'on':''}">Before ${PH.filter(x=>x.stage==='before'&&A.before.some(a=>a.key===x.angle)).length}/${A.before.length}</button><button data-s="during" class="${pstage==='during'?'on':''}">During ${PH.filter(x=>x.stage==='during'&&A.during.some(a=>a.key===x.angle)).length}/${A.during.length}</button></div>
  <div class="card"><h3>${pstage==='before'?'Photo walk-through':'Teardown checkpoints'}</h3><p class="mut">${pstage==='before'?'Shoot every angle before anything comes off. Each shot shows where to stand and what to capture.':'Shoot these as you reach each stage so you can match parts on reassembly.'}</p>
  <div class="row" style="margin-top:12px"><button class="btn pri" id="wgo" style="flex:1">${ic('camera')}<span style="white-space:nowrap">${got===0?'Start walk-through':next>=0?'Continue':'Review shots'}</span></button><button class="btn" id="wvidb">${ic('video')}Video</button></div>
  <div class="row" style="margin-top:8px"><button class="btn sm" id="aichk">${ic('wand')}Check my photos with AI</button><button class="btn sm" id="wext">${ic('plus')}Extra photo</button></div></div>
  <div class="grid">${list.map((a,i)=>{const h=have(a.key);return h?`<button class="shot" data-v="${h.id}"><img src="${h.th}" alt="${esc(a.title)}"><span class="cap">${esc(a.title)}</span></button>`:`<button class="shot empty" data-w="${i}">${ic('camera')}${esc(a.title)}</button>`}).join('')}</div>
  ${extras.length?`<h3 style="margin:18px 0 8px">Extras and video frames</h3><div class="grid">${extras.map(h=>`<button class="shot" data-v="${h.id}"><img src="${h.th}" alt=""><span class="cap">${esc(h.label)}</span></button>`).join('')}</div>`:''}`;
  $$('#photos .seg button').forEach(b=>b.onclick=()=>{pstage=b.dataset.s;renderPhotos()});
  $('#wgo').onclick=()=>openWiz(pstage,next>=0?next:0);$$('#photos [data-w]').forEach(b=>b.onclick=()=>openWiz(pstage,+b.dataset.w));
  $$('#photos [data-v]').forEach(b=>b.onclick=()=>openViewer(b.dataset.v));
  $('#wvidb').onclick=()=>{W={stage:pstage,list,i:0,pending:null,vid:true};$('#wvid').click()};
  $('#wext').onclick=()=>{W={stage:pstage,list,i:-1,pending:null,extra:true};$('#wcam').click()};
  $('#aichk').onclick=aiCheck}
function posSVG(pos){const c={front:[16,40,0],rear:[104,40,180],left:[60,10,90],right:[60,70,-90],top:[60,40,0],bottom:[60,40,0],detail:[96,20,150]}[pos]||[16,40,0];
  return `<svg viewBox="0 0 120 80"><rect class="eb" x="34" y="26" width="52" height="28" rx="6"/><text class="et" x="60" y="43">ENGINE</text>${pos==='top'||pos==='bottom'?'<circle class="rg2" cx="60" cy="40" r="30"/>':''}<g transform="translate(${c[0]} ${c[1]}) rotate(${c[2]})"><rect class="cam" x="-9" y="-6" width="14" height="12" rx="2"/><path class="cam" d="M5 -3L12 -7V7L5 3z"/></g>${pos==='detail'?'<path class="rg2" d="M84 28L70 38"/>':''}</svg>`}
let W=null;
function openWiz(stage,i){const list=anglesOf()[stage];W={stage,list,i,pending:null};$('#wiz').classList.add('on');renderWiz()}
function closeWiz(){$('#wiz').classList.remove('on');W=null;renderPhotos();renderAll(true)}
function renderWiz(){if(!W)return;const{list,i,stage}=W,c=$('#wizc');
  if(i>=list.length){const got=list.filter(a=>PH.find(x=>x.stage===stage&&x.angle===a.key)).length;c.innerHTML=`<div class="wtop"><button class="ib" id="wx" aria-label="Close">${ic('x')}</button><div class="wbar"><i style="width:100%"></i></div></div><div class="wbody" style="display:grid;align-content:center;text-align:center"><div class="lg" style="width:84px;height:84px;margin:0 auto 14px">${LOGO}</div><h2>${got===list.length?'All angles captured':got+' of '+list.length+' captured'}</h2><p>${got===list.length?'You now have a full reference set. Start the teardown, and use the gallery during reassembly.':'You can come back to the missing shots any time from the Photos tab.'}</p></div><div class="wfoot"><button class="btn" id="wback">${ic('back')}Back</button><button class="btn pri" id="wdone" style="flex:1">Done</button></div>`;
    $('#wx').onclick=closeWiz;$('#wdone').onclick=closeWiz;$('#wback').onclick=()=>{W.i=list.length-1;renderWiz()};return}
  const a=list[i],ex=PH.find(x=>x.stage===stage&&x.angle===a.key),pend=W.pending;
  c.innerHTML=`<div class="wtop"><button class="ib" id="wx" aria-label="Close">${ic('x')}</button><div class="wbar"><i style="width:${(i+(ex?1:0))/list.length*100}%"></i></div><span class="mut">${i+1}/${list.length}</span></div>
  <div class="wbody"><div class="wdiag">${posSVG(a.pos)}</div><div class="mut disp" style="letter-spacing:.14em">${stage==='before'?'Before teardown':'During teardown'}</div><h2>${esc(a.title)}</h2><p>${esc(a.how)}</p>
  ${pend?`<img class="wprev" src="${pend}" alt="Preview"><label class="lab">Note (optional)</label><input class="f" id="wnote" placeholder="Anything to remember about this shot" maxlength="140">`:ex?`<img class="wprev" src="${ex.th}" alt="Captured" style="max-height:26dvh"><p class="hint">Already captured. Shoot again to replace it.</p>`:''}</div>
  <div class="wfoot">${pend?`<button class="btn" id="wre">Retake</button><button class="btn pri" id="wuse" style="flex:1">Use photo</button>`:`<button class="btn" id="wskip">${i>0?'Skip':'Skip'}</button><button class="shutter" id="wshot" aria-label="Take photo"></button><button class="btn" id="wlibb">Library</button>`}</div>`;
  $('#wx').onclick=closeWiz;
  if(pend){$('#wre').onclick=()=>{W.pending=null;renderWiz();$('#wcam').click()};$('#wuse').onclick=async()=>{const note=$('#wnote')?.value||'';const p=curProj();if(ex)await delPhoto(ex.id);await savePhoto({id:uid(),pid:p.id,stage,angle:a.key,label:a.title,note,data:W.pending,th:await shrink(W.pending,360,.7),t:Date.now()});W.pending=null;W.i++;renderWiz()}}
  else{$('#wskip').onclick=()=>{W.i++;renderWiz()};$('#wshot').onclick=()=>$('#wcam').click();$('#wlibb').onclick=()=>$('#wlib').click();if(i===0&&stage==='before'&&!ex){}}}
async function wizFile(f,fromLib){if(!f)return;try{const d=await fileImg(f);const fl=$('#flash');fl.classList.remove('on');void fl.offsetWidth;fl.classList.add('on');
    if(W?.extra){const p=curProj();await savePhoto({id:uid(),pid:p.id,stage:W.stage,angle:'extra-'+uid(),label:'Extra photo',note:'',data:d,th:await shrink(d,360,.7),t:Date.now()});toast('Photo saved');W=null;renderPhotos();return}
    if(W){W.pending=d;renderWiz()}}catch(e){toast(e.message)}}
$('#wcam').onchange=e=>{const f=e.target.files[0];e.target.value='';wizFile(f)};$('#wlib').onchange=e=>{const f=e.target.files[0];e.target.value='';wizFile(f,true)};
$('#wvid').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!W)return;toast('Reading video…');try{const{o}=await frames(f,12,1400),p=curProj(),base=Date.now();
  for(let k=0;k<o.length;k++)await savePhoto({id:uid(),pid:p.id,stage:W.stage,angle:'walk-'+base+'-'+k,label:'Video frame '+(k+1),note:'',data:o[k],th:await shrink(o[k],360,.7),t:base+k});toast('Saved 12 frames from your video');W=null;renderPhotos()}catch(x){toast(x.message)}};
function openViewer(id){const list=PH.filter(x=>x.stage===pstage||true).filter(x=>x.stage===(PH.find(y=>y.id===id)?.stage)),idx=list.findIndex(x=>x.id===id);viewAt(list,idx)}
function viewAt(list,i){const h=list[i],c=$('#viewc');$('#viewer').classList.add('on');
  c.innerHTML=`<div class="wtop"><button class="ib" id="vx" aria-label="Close">${ic('x')}</button><div style="flex:1"><b>${esc(h.label)}</b><div class="mut">${i+1} of ${list.length} · ${h.stage==='before'?'Before':'During'}</div></div></div><div class="vimg"><img src="${h.data}" alt="${esc(h.label)}"></div>
  <div style="padding:10px 20px 0"><input class="f" id="vn" value="${esc(h.note)}" placeholder="Add a note to this photo" maxlength="140"></div>
  <div class="wfoot"><button class="btn" id="vp" ${i===0?'disabled':''} aria-label="Previous">${ic('back')}</button><button class="btn" id="vd" aria-label="Delete">${ic('trash')}</button><button class="btn" id="va">${ic('msg')}Ask AI</button><button class="btn" id="vnx" ${i===list.length-1?'disabled':''} aria-label="Next">${ic('chev')}</button></div>`;
  $('#vx').onclick=()=>{$('#viewer').classList.remove('on');renderPhotos()};$('#vp').onclick=()=>viewAt(list,i-1);$('#vnx').onclick=()=>viewAt(list,i+1);
  $('#vn').onchange=async e=>{h.note=e.target.value;await savePhoto(h)};
  $('#vd').onclick=async()=>{await delPhoto(h.id);list.splice(i,1);if(!list.length){$('#viewer').classList.remove('on');renderPhotos()}else viewAt(list,Math.min(i,list.length-1))};
  $('#va').onclick=async()=>{$('#viewer').classList.remove('on');go('ask');const s=await shrink(h.data,1024,.78);send(`Look at this photo (${h.label}${h.note?': '+h.note:''}). What do you see, and is there anything I should note before or during teardown?`,[{thumb:h.th,parts:[{inlineData:{mimeType:'image/jpeg',data:s.split(',')[1]}}]}])}}
async function aiCheck(){const p=curProj();const A=anglesOf();const pics=A[pstage].map(a=>PH.find(x=>x.stage===pstage&&x.angle===a.key)).filter(Boolean);
  if(pics.length<2)return toast('Take a few photos first');const pick=pics.length>8?pics.filter((_,i)=>i%Math.ceil(pics.length/8)===0).slice(0,8):pics;
  const media=[];for(const h of pick){const s=await shrink(h.data,800,.7);media.push({thumb:h.th,parts:[{text:`[Photo: ${h.label}]`},{inlineData:{mimeType:'image/jpeg',data:s.split(',')[1]}}]})}
  const missing=A[pstage].filter(a=>!PH.find(x=>x.stage===pstage&&x.angle===a.key)).map(a=>a.title);go('ask');
  send(`Review these ${pstage==='before'?'pre-teardown':'teardown'} photos of my ${engOf(p).title}. Which angles look unclear or blurry, what important details should I re-shoot, and anything notable (leaks, damage, missing parts, previous repairs, routing worth labeling)? ${missing.length?'Not yet photographed: '+missing.join(', ')+'.':''}`,media,`Check my ${pstage==='before'?'pre-teardown':'teardown'} photos (${media.length})`)}

/* ---------- chat (streaming) ---------- */
const chat=$('#chat'),input=$('#input'),sendBtn=$('#send'),preview=$('#preview'),fileEl=$('#file');
let history=[],pending=[],busy=false,ctl=null;
const part=u=>({inlineData:{mimeType:'image/jpeg',data:u.split(',')[1]}});
fileEl.onchange=async()=>{const fs=[...fileEl.files];fileEl.value='';for(const f of fs){if(pending.length>=6)break;try{if(f.type.startsWith('image/')){const d=await fileImg(f,1024,.78);pending.push({thumb:d,tag:'photo',parts:[part(d)]})}else if(f.type.startsWith('video/')){const{o,d}=await frames(f,8,1024);pending.push({thumb:o[0],tag:'video',parts:[{text:`[The next ${o.length} images are evenly spaced frames from a ${Math.round(d)}-second video, in order.]`},...o.map(part)]})}}catch(e){addMsg('bot err',e.message)}rp()}};
function rp(){preview.innerHTML='';pending.forEach((p,i)=>{const d=document.createElement('div');d.className='pv';d.innerHTML=`<img src="${p.thumb}" alt="${p.tag}"><button aria-label="Remove">×</button>`;d.querySelector('button').onclick=()=>{pending.splice(i,1);rp()};preview.appendChild(d)})}
$('#attach').onclick=()=>fileEl.click();
function md(t){const il=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');
  return t.split(/\n{2,}/).map(b=>{const l=b.split('\n');if(l.every(x=>/^\s*[-*•]\s+/.test(x)))return'<ul>'+l.map(x=>'<li>'+il(x.replace(/^\s*[-*•]\s+/,''))+'</li>').join('')+'</ul>';if(l.every(x=>/^\s*\d+[.)]\s+/.test(x)))return'<ol>'+l.map(x=>'<li>'+il(x.replace(/^\s*\d+[.)]\s+/,''))+'</li>').join('')+'</ol>';return'<p>'+l.map(il).join('<br>')+'</p>'}).join('')}
function addMsg(c,content,html){$('#empty')?.remove();const d=document.createElement('div');d.className='msg '+c;html?d.innerHTML=content:d.textContent=content;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
const ctx=()=>{const p=curProj();if(!p)return'';const e=engOf(p),st=stepsFor(e),done=st.filter((_,i)=>p.checks[i]).length,ni=st.findIndex((_,i)=>!p.checks[i]);return`Project: ${p.name}. Engine: ${e.title} (${e.cfg}, ${e.disp}, ${VALVE[e.valve]}, timing ${TIMING[e.timing]}, ${FUEL[e.fuel]}${e.boost?', boosted':''}, ${e.block==='alu'?'aluminum':'iron'} block). Known notes: ${e.note}. Teardown progress: ${done}/${st.length}. Current step: ${ni>=0?st[ni].t:'finished'}. Project notes: ${p.notes||'none'}.`};
function renderCtx(){const p=curProj();$('#ctx').innerHTML=p?`<span><b>${esc(p.name)}</b> · ${esc(engOf(p).title)}</span>${ic('chev')}`:`<span>No project selected. Answers will be general.</span>${ic('chev')}`;$('#ctx').onclick=()=>go(p?'steps':'lib')}
async function streamTo(el,body,signal,st){
  const r=await fetch('/api/chat',{method:'POST',signal,headers:{'Content-Type':'application/json'},body});
  if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(r.status===404?'The chat function was not found (404). Make sure edge-functions/api/chat.js is in the root of your repo, then redeploy. You can check it by opening /api/chat in your browser.':d.error||`Request failed (${r.status}). Try fewer or smaller photos.`)}
  const paint=()=>{const near=chat.scrollHeight-chat.scrollTop-chat.clientHeight<150;el.innerHTML=md(st.text.slice(0,st.shown))+'<span class="caret"></span>';if(near)chat.scrollTop=chat.scrollHeight};
  const typer=new Promise(res=>{const tick=()=>{if(st.stop)return res();if(st.shown<st.text.length){st.shown=Math.min(st.text.length,st.shown+Math.max(2,Math.ceil((st.text.length-st.shown)/14)));paint()}if(st.done&&st.shown>=st.text.length)return res();requestAnimationFrame(tick)};tick()});
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  try{for(;;){const{value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();for(const l of ls){if(!l.startsWith('data:'))continue;try{const j=JSON.parse(l.slice(5));st.text+=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('')}catch{}}}}finally{st.done=true}
  await typer}
function sendUI(){sendBtn.innerHTML=ic(busy?'stop':'up');sendBtn.setAttribute('aria-label',busy?'Stop':'Send')}
async function send(text,extra=[],label){
  if(busy){ctl?.abort();return}
  text=(text??input.value).trim();const media=[...pending,...extra];if(!text&&!media.length)return;
  go('ask');if(!navigator.onLine){addMsg('bot err','You are offline. Chat needs a connection, but engines, steps and photos still work.');return}
  busy=true;sendUI();pending=[];rp();input.value='';size();
  addMsg('user',(media.length?`<div class="thumbs">${media.map(m=>`<img src="${m.thumb}" alt="">`).join('')}</div>`:'')+(text?`<div>${esc(label||text)}</div>`:''),true);
  const el=addMsg('bot','<div class="typing"><i></i><i></i><i></i></div>',true),st={text:'',shown:0,done:false,stop:false};ctl=new AbortController();
  const parts=[...media.flatMap(m=>m.parts),{text:text||'What do you see here? Point out anything I should note.'}];
  try{await streamTo(el,JSON.stringify({contents:[...history,{role:'user',parts}],context:ctx()}),ctl.signal,st)}
  catch(e){st.stop=true;if(e.name!=='AbortError'){el.className='msg bot err';el.textContent=e.message;st.text=''}else st.text=st.text.slice(0,st.shown)}
  if(st.text){el.innerHTML=md(st.text);history.push({role:'user',parts:[{text:(media.length?`[${media.length} attachment(s) shown] `:'')+(text||'')}]},{role:'model',parts:[{text:st.text}]})}
  else if(!el.className.includes('err')){el.className='msg bot err';el.textContent='No answer came back. Try rephrasing or adding a clearer photo.'}
  busy=false;sendUI();chat.scrollTop=chat.scrollHeight}
const size=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px'};
input.oninput=size;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();send()}};sendBtn.onclick=()=>send();
const Q=['What tools do I need?','Why might this engine have failed?','What should I label as I go?','How do I check for a cracked block or head?'];
$('#quick').innerHTML=Q.map((q,i)=>`<button class="chipb" data-q="${i}">${q}</button>`).join('');$$('#quick button').forEach(b=>b.onclick=()=>send(Q[+b.dataset.q]));

/* ---------- boot ---------- */
addEventListener('unhandledrejection',e=>{if(e.reason?.message==='timeout')return;toast('Something went wrong: '+(e.reason?.message||'unknown error'))});addEventListener('error',e=>toast('Error: '+(e.message||'unknown')));
function renderAll(light){renderProjBtn();renderSteps();renderCtx();if(!light){renderPhotos()}}
const net=()=>{if(storageOK){$('#off').textContent='Offline: engines, steps and photos work. Chat needs a connection.';$('#off').hidden=navigator.onLine}};addEventListener('online',net);addEventListener('offline',net);net();
if(window.visualViewport){const vv=()=>{document.documentElement.style.setProperty('--h',visualViewport.height+'px');scrollTo(0,0)};visualViewport.addEventListener('resize',vv);vv()}
if(S.active&&!curProj())S.active=null;
sendUI();renderMakes();renderLib();renderAll();loadPhotos();if(curProj())go('steps');
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
Promise.all([document.fonts?.ready?.catch(()=>0),new Promise(r=>setTimeout(r,1700))]).then(()=>{$('#splash').classList.add('out');setTimeout(()=>$('#splash').remove(),800)});
</script>
